plugins {
    id 'org.quiltmc.loom' version '1.7.4'
}

base.archivesName = 'glowperf'
version = "${mod_version}-mc${minecraft_version}-quilt"

sourceSets.main {
    java.srcDirs = ['src/main/java', '../fabric/src/main/java', '../common/src/main/java']
    resources.srcDirs = ['src/main/resources', '../common/src/main/resources']
}

processResources {
    from('../fabric/src/main/resources/glowperf.mixins.json')
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "org.quiltmc:quilt-loader:${quilt_loader_version}"
    modImplementation "org.quiltmc.quilted-fabric-api:quilted-fabric-api:${qfapi_version}"
}
